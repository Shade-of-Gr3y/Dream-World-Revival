<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

<title>Pokémon Global Link</title>

<script src="/3ds.pokemon-gl.com/share/js/jquery-1.9.0.min.js"></script>
<script src="/3ds.pokemon-gl.com/share/js/loader.js"></script>
<script>
loadStyles([
  '/share/css/common.css',
  '/pc/common/css/base.css',
  '/pc/common/css/parts/color_default.css',
  '/pc/common/css/parts/color_x.css',
  '/pc/common/css/parts/color_y.css',
  '/pc/common/css/parts/table.css',
  '/pc/common/css/parts/title.css',
  '/pc/common/css/parts/dialog.css',
  '/pc/common/css/parts/button.css',
  '/pc/common/css/parts/pokemon.selector.css',
  '/pc/common/css/parts/type.css',
  '/pc/common/css/parts/icon.css',
  '/pc/common/css/parts/panel.css',
  '/pc/common/css/parts/form.css',
  '/pc/common/css/top.css'
]);
loadScripts([
  '/share/js/json2.js',
  '/share/js/jquery.cookie.min.js',
  '/share/js/jquery.easing.1.3.js',
  '/share/js/share.base.js',
  '/share/js/share.date.js',
  '/share/js/share.model.text.js',
  '/share/js/share.model.api.js',
  '/share/js/share.model.error.js',
  '/pc/common/js/pc.api.error.js',
  '/pc/common/js/pc.base.js',
  '/pc/common/js/pc.model.dialog.js'
]);
</script>
<script>

PGL.INFO.PAGENAME = ['locale.root.top','locale.mypage.timeline'];

</script>

<script>
loadStyles([
  '/pc/common/css/settings.css'
]);
loadScripts([
  '/pc/common/js/top/pc.top.common.js',
  '/pc/common/js/pc.login.js'
]);
</script>
<script src="../_restore/mock-api-interceptor.js" data-pgl-restore="mock-api-interceptor.js"></script>
<script src="../_restore/plugin-guards.js" data-pgl-restore="plugin-guards.js"></script>
<script src="../_restore/runtime-fixes.js" data-pgl-restore="runtime-fixes.js"></script>
</head>
<body><!-- Wrapper Start //-->

<div id="wrapper"> 
  <script type="text/html" id="template"><!-- Header Start //-->
    
    <header></header><!-- Header End //--><!-- Contents Start //-->
    
    
    <div id="contents">
      <div class="top-column top-column-span1" id="leftColumn"> 
        <div class="top-unit top-unit-box" id="login">
          <iframe src="" frameborder="0" scrolling="no"></iframe>
        </div>
        
        <div class="top-unit" id="support">
          <a href="/3ds.pokemon-gl.com/support/">
            <h2>{{GLOSSARY_CONTENT_SUPPORT}}</h2>
            <p>{{GLOSSARY_TOP_SUPPORT_TXT}}</p>
          </a>
        </div>

        <div class="banner" id="external-site-banners">
          <ul></ul>
        </div>
      </div>
      
      <div class="top-column top-column-span2" id="centerColumn"> 
        <div class="top-unit top-unit-box" id="mainView">
          <div class="content"></div>
        </div>
        <div class="top-unit top-unit-box" id="information">
          <h2>{{GLOSSARY_CONTENT_INFORMATION}}</h2>
          <div class="content"></div>
          <p class="more"><a href="/3ds.pokemon-gl.com/information/">{{GLOSSARY_TOP_TO_INFOLIST}}</a></p>
        </div>
      </div>
      
      <div class="top-column top-column-span1" id="rightColumn"> 
        <div class="top-unit top-unit-box" id="event">
          <h2 class="squeeze">{{GLOSSARY_TOP_EVENT_TITLE}}</h2>
          <div class="content"></div>
          <p class="more"><a href="/3ds.pokemon-gl.com/calendar/" class="squeeze">{{GLOSSARY_TOP_TO_EVENT_CALENDER}}</a></p>
        </div>
        <div class="top-unit top-unit-box banner" id="language-select">
          <ul>
            <li><img src="/3ds.pokemon-gl.com/pc/common/images/top/banner_right_01.gif" alt="" /></li>
          </ul>
        </div>
      </div>
      
    </div><!-- Contents End //--><!-- Footer Start //-->
    
    
    <footer></footer><!-- Footer End //-->
    
  </script><!-- Wrapper End //-->
  
</div>
</body>
</html>
